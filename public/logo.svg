<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#gradPrimary)" filter="url(#shadow)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Open Book Symbol -->
  <g transform="translate(96, 120)">
    <!-- Left Book Page -->
    <path d="M160,240 C100,210 30,220 10,230 L10,60 C30,50 100,40 160,70 Z" 
          fill="#ffffff" opacity="0.95" />
    
    <!-- Right Book Page -->
    <path d="M160,240 C220,210 290,220 310,230 L310,60 C290,50 220,40 160,70 Z" 
          fill="#ffffff" />
    
    <!-- Book Spine Glow -->
    <path d="M160,70 L160,245" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />

    <!-- Bookmark Ribbon -->
    <path d="M210,50 L210,130 L190,115 L170,130 L170,50 Z" fill="#38bdf8" />

    <!-- Page Detail Lines -->
    <line x1="45" y1="95" x2="135" y2="105" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
    <line x1="45" y1="125" x2="135" y2="135" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
    <line x1="45" y1="155" x2="115" y2="162" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />

    <line x1="185" y1="105" x2="275" y2="95" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" />
    <line x1="185" y1="135" x2="275" y2="125" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" />
    <line x1="205" y1="162" x2="275" y2="155" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Sparkle Stars -->
  <circle cx="390" cy="120" r="10" fill="#facc15" />
  <circle cx="120" cy="110" r="7" fill="#ffffff" opacity="0.8" />
</svg>
